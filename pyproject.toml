[project]
name = "logit-tagger"
description = "Tag, check and classify images with the Qwen3-VL text encoder a workflow already loads. Each answer is a probability read from the encoder's logits."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["logit-classifier>=0.4.0"]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff==0.16.2",
]

[project.urls]
Repository = "https://github.com/Blakeem/ComfyUI-LogitTagger"

[tool.comfy]
PublisherId = "blake"
DisplayName = "Logit Tagger"

[tool.ruff]
# ComfyUI core sets no line-length and ignores E501. 120 matches comfy-cli.
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Explicit select, since ruff 0.16.0 changed the default set from 59 to 413 rules.
select = [
    # ComfyUI core's own selection
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "T",      # flake8-debugger (T10) + flake8-print (T20)
    "N805",   # N802/N804 would reject `def INPUT_TYPES(s)`, and N999 the hyphenated pack directory
    "S102",   # exec-builtin, which `comfy node publish` scans for
    "S307",   # suspicious-eval-usage, which `comfy node publish` scans for

    # beyond core
    "I",      # isort import ordering
    "UP",     # pyupgrade to py312 idioms
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific, including RUF100 unused-noqa
]

# Core's ignore list minus E402, so a documented `# noqa: E402` never becomes RUF100.
ignore = [
    "E501",   # line-too-long
    "E722",   # bare-except
    "E731",   # lambda-assignment
    "E712",   # true-false-comparison
    "E741",   # ambiguous-variable-name
]

[tool.ruff.lint.per-file-ignores]
# The A/B harness is a console tool excluded from the registry archive, so printing is its interface.
"tests-AB/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not gpu\""
markers = [
    "gpu: needs CUDA and model files, deselected by default through addopts",
    "slow: long-running test",
]
